# Railway production config — deploy from repo root.
# Docs: docs/operations/railway.mdx

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "code-analysis/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
