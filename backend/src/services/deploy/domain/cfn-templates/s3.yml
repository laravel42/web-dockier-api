AWSTemplateFormatVersion: "2010-09-09"
# Static website on S3 behind CloudFront, with Origin Access Control.
#
# The bucket is created and populated by AwsS3Adapter BEFORE this stack is
# deployed; the stack only attaches the bucket policy and fronts it with a CDN.
#
# SourceBucket is authoritative and required. The bucket naming rule lives in
# staticSiteBucketName() in the adapter and must NOT be duplicated here — a
# derived name like "${AppName}-static-site" has to agree with the adapter for
# the origin to resolve at all, and drifted from it once already.
Description: Deploy a static website with CloudFront CDN over an existing S3 bucket.

Parameters:
  AppName:
    Type: String
    Description: Human-facing label for the OAC name, distribution comment and tags.
  BuildId:
    Type: String
    Default: ""
  CallbackUrl:
    Type: String
    Default: ""
  SourceBucket:
    Type: String
    Description: Name of the existing S3 bucket holding the built site.
    MinLength: 3

Resources:
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SourceBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AppName} static site"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !Sub "${SourceBucket}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Name
          Value: !Ref AppName
        - Key: BuildId
          Value: !Ref BuildId

Outputs:
  AppUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  WebsiteBucketName:
    Value: !Ref SourceBucket
  BuildId:
    Value: !Ref BuildId
