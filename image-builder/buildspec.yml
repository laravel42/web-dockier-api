version: 0.2

env:
  shell: bash
  variables:
    AWS_ACCOUNT_ID: "123456789012"
    AWS_DEFAULT_REGION: "us-east-1"
    IMAGE_REPO_NAME: "my-app"
    CACHE_REPO_NAME: "my-app-cache"

phases:
  install:
    commands:
      - set -euo pipefail
      - echo "Installing buildx if missing"
      - mkdir -p ~/.docker/cli-plugins
      - |
        if ! docker buildx version >/dev/null 2>&1; then
          curl -fsSL \
            "https://github.com/docker/buildx/releases/latest/download/buildx-linux-amd64" \
            -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx
        fi
      - docker version
      - docker buildx version

  pre_build:
    commands:
      - set -euo pipefail
      - |
        IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}"
        CACHE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${CACHE_REPO_NAME}"
        IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
        SHORT_TAG="${IMAGE_TAG:0:12}"
        echo "export IMAGE_URI=${IMAGE_URI}" > /tmp/build_env.sh
        echo "export CACHE_URI=${CACHE_URI}" >> /tmp/build_env.sh
        echo "export IMAGE_TAG=${IMAGE_TAG}" >> /tmp/build_env.sh
        echo "export SHORT_TAG=${SHORT_TAG}" >> /tmp/build_env.sh
        cat /tmp/build_env.sh
      - |
        aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" >/dev/null 2>&1 \
          || aws ecr create-repository --repository-name "$IMAGE_REPO_NAME"
        aws ecr describe-repositories --repository-names "$CACHE_REPO_NAME" >/dev/null 2>&1 \
          || aws ecr create-repository --repository-name "$CACHE_REPO_NAME"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - docker buildx create --name cbuilder --use || docker buildx use cbuilder
      - docker buildx inspect --bootstrap

  build:
    commands:
      - |
        set -euo pipefail
        source /tmp/build_env.sh

        # Auto-detect Dockerfile if not present
        if [ ! -f "Dockerfile" ]; then
          echo "No Dockerfile found, auto-detecting project type..."

          # ── PHP / Laravel ──
          if [ -f "composer.json" ] || [ -f "artisan" ]; then
            echo "Detected PHP project"
            IS_LARAVEL=0
            [ -f "artisan" ] && IS_LARAVEL=1

            if [ "$IS_LARAVEL" -gt 0 ]; then
              echo "Detected Laravel framework"
              HAS_NODE=0
              [ -f "package.json" ] && HAS_NODE=1

              if [ "$HAS_NODE" -gt 0 ]; then
                echo "Frontend assets detected (package.json found)"
                cat > Dockerfile <<'DEOF'
        FROM public.ecr.aws/docker/library/php:8.3-fpm-bookworm AS base
        RUN apt-get update && apt-get install -y \
            git unzip curl libpng-dev libjpeg-dev libfreetype6-dev \
            libzip-dev libonig-dev libxml2-dev libpq-dev nginx supervisor \
            && docker-php-ext-configure gd --with-freetype --with-jpeg \
            && docker-php-ext-install pdo pdo_mysql pdo_pgsql mbstring xml zip gd bcmath opcache pcntl \
            && pecl install redis && docker-php-ext-enable redis \
            && apt-get clean && rm -rf /var/lib/apt/lists/*
        COPY --from=public.ecr.aws/docker/library/composer:2 /usr/bin/composer /usr/bin/composer
        WORKDIR /var/www/html

        FROM base AS deps
        COPY composer.json composer.lock* ./
        RUN composer install --no-dev --no-scripts --no-autoloader --prefer-dist

        FROM public.ecr.aws/docker/library/node:20-alpine AS frontend
        WORKDIR /app
        COPY package*.json yarn.lock* pnpm-lock.yaml* bun.lockb* ./
        RUN if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; \
            elif [ -f yarn.lock ]; then yarn install --frozen-lockfile; \
            else npm ci; fi
        COPY . .
        RUN if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm run build; \
            elif [ -f yarn.lock ]; then yarn build; \
            else npm run build; fi

        FROM base AS runner
        COPY . .
        COPY --from=deps /var/www/html/vendor ./vendor
        COPY --from=frontend /app/public/build ./public/build
        RUN composer dump-autoload --optimize \
            && if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || touch .env; fi \
            && php artisan key:generate --force 2>/dev/null || true \
            && php artisan config:clear 2>/dev/null || true \
            && php artisan route:clear 2>/dev/null || true \
            && php artisan view:clear 2>/dev/null || true \
            && chown -R www-data:www-data storage bootstrap/cache
        DEOF
              else
                echo "No frontend assets (no package.json)"
                cat > Dockerfile <<'DEOF'
        FROM public.ecr.aws/docker/library/php:8.3-fpm-bookworm AS base
        RUN apt-get update && apt-get install -y \
            git unzip curl libpng-dev libjpeg-dev libfreetype6-dev \
            libzip-dev libonig-dev libxml2-dev libpq-dev nginx supervisor \
            && docker-php-ext-configure gd --with-freetype --with-jpeg \
            && docker-php-ext-install pdo pdo_mysql pdo_pgsql mbstring xml zip gd bcmath opcache pcntl \
            && pecl install redis && docker-php-ext-enable redis \
            && apt-get clean && rm -rf /var/lib/apt/lists/*
        COPY --from=public.ecr.aws/docker/library/composer:2 /usr/bin/composer /usr/bin/composer
        WORKDIR /var/www/html

        FROM base AS deps
        COPY composer.json composer.lock* ./
        RUN composer install --no-dev --no-scripts --no-autoloader --prefer-dist

        FROM base AS runner
        COPY . .
        COPY --from=deps /var/www/html/vendor ./vendor
        RUN composer dump-autoload --optimize \
            && if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || touch .env; fi \
            && php artisan key:generate --force 2>/dev/null || true \
            && php artisan config:clear 2>/dev/null || true \
            && php artisan route:clear 2>/dev/null || true \
            && php artisan view:clear 2>/dev/null || true \
            && chown -R www-data:www-data storage bootstrap/cache
        DEOF
              fi

              # Append nginx + supervisor config (common to both variants)
              cat >> Dockerfile <<'DEOF'

        # Nginx config
        RUN echo 'server { \n\
            listen 80; \n\
            server_name _; \n\
            root /var/www/html/public; \n\
            index index.php; \n\
            client_max_body_size 100M; \n\
            location / { try_files $uri $uri/ /index.php?$query_string; } \n\
            location ~ \.php$ { \n\
                fastcgi_pass 127.0.0.1:9000; \n\
                fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name; \n\
                include fastcgi_params; \n\
            } \n\
            location ~ /\.(?!well-known).* { deny all; } \n\
        }' > /etc/nginx/sites-available/default

        # Supervisor config (nginx + php-fpm)
        RUN echo '[supervisord] \n\
        nodaemon=true \n\
        [program:php-fpm] \n\
        command=php-fpm -F \n\
        autostart=true \n\
        autorestart=true \n\
        [program:nginx] \n\
        command=nginx -g "daemon off;" \n\
        autostart=true \n\
        autorestart=true' > /etc/supervisor/conf.d/app.conf

        EXPOSE 80
        CMD ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/app.conf"]
        DEOF
            else
              cat > Dockerfile <<'DEOF'
        FROM public.ecr.aws/docker/library/php:8.3-cli-bookworm
        RUN apt-get update && apt-get install -y git unzip libzip-dev \
            && docker-php-ext-install zip pdo pdo_mysql \
            && apt-get clean && rm -rf /var/lib/apt/lists/*
        COPY --from=public.ecr.aws/docker/library/composer:2 /usr/bin/composer /usr/bin/composer
        WORKDIR /app
        COPY composer.json composer.lock* ./
        RUN composer install --no-dev --prefer-dist
        COPY . .
        EXPOSE 8000
        CMD ["php", "-S", "0.0.0.0:8000", "-t", "public"]
        DEOF
            fi

          # ── Node.js ──
          elif [ -f "package.json" ]; then
            echo "Detected Node.js project"
            HAS_NEXT=$(grep -c '"next"' package.json 2>/dev/null || echo "0")
            HAS_BUILD=$(grep -c '"build"' package.json 2>/dev/null || echo "0")
            HAS_FRONTEND_BUILD=0
            [ -f "pnpm-workspace.yaml" ] && [ -f "frontend/package.json" ] && \
              [ "$(grep -c '"build"' frontend/package.json 2>/dev/null || echo "0")" -gt 0 ] && HAS_FRONTEND_BUILD=1
            PKG_MGR="npm"
            [ -f "pnpm-lock.yaml" ] && PKG_MGR="pnpm"
            [ -f "yarn.lock" ] && PKG_MGR="yarn"
            [ -f "bun.lockb" ] && PKG_MGR="bun"

            if [ "$HAS_FRONTEND_BUILD" -gt 0 ]; then
              echo "Detected pnpm workspace with frontend (Vite/React SPA)"
              cat > Dockerfile <<'DEOF'
        FROM public.ecr.aws/docker/library/node:20-alpine AS builder
        WORKDIR /app
        RUN corepack enable
        COPY pnpm-lock.yaml pnpm-workspace.yaml package.json ./
        COPY frontend/package.json ./frontend/
        RUN pnpm install --frozen-lockfile
        COPY frontend ./frontend
        RUN pnpm --filter frontend run build

        FROM public.ecr.aws/docker/library/nginx:alpine AS runner
        COPY --from=builder /app/frontend/dist /usr/share/nginx/html
        RUN echo 'server { listen 80; root /usr/share/nginx/html; index index.html; location / { try_files $uri $uri/ /index.html; } }' > /etc/nginx/conf.d/default.conf
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
        DEOF
            elif [ "$HAS_NEXT" -gt 0 ]; then
              cat > Dockerfile <<'DEOF'
        FROM public.ecr.aws/docker/library/node:20-alpine AS deps
        WORKDIR /app
        COPY package*.json yarn.lock* pnpm-lock.yaml* bun.lockb* ./
        RUN if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; \
            elif [ -f yarn.lock ]; then yarn install --frozen-lockfile; \
            elif [ -f bun.lockb ]; then npm i -g bun && bun install --frozen-lockfile; \
            else npm ci; fi

        FROM public.ecr.aws/docker/library/node:20-alpine AS builder
        WORKDIR /app
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm build; \
            elif [ -f yarn.lock ]; then yarn build; \
            else npm run build; fi

        FROM public.ecr.aws/docker/library/node:20-alpine AS runner
        WORKDIR /app
        ENV NODE_ENV=production
        RUN addgroup --system --gid 1001 nodejs && adduser --system --uid 1001 nextjs
        COPY --from=builder /app/public ./public
        COPY --from=builder /app/.next ./.next
        COPY --from=builder /app/node_modules ./node_modules
        COPY --from=builder /app/package.json ./package.json
        USER nextjs
        EXPOSE 3000
        ENV PORT=3000 HOSTNAME="0.0.0.0"
        CMD ["node_modules/.bin/next", "start"]
        DEOF
            elif [ "$HAS_BUILD" -gt 0 ]; then
              cat > Dockerfile <<DEOF
        FROM public.ecr.aws/docker/library/node:20-alpine AS builder
        WORKDIR /app
        COPY . .
        RUN if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile && pnpm build; \\
            elif [ -f yarn.lock ]; then yarn install --frozen-lockfile && yarn build; \\
            else npm ci && npm run build; fi

        FROM public.ecr.aws/docker/library/node:20-alpine
        WORKDIR /app
        ENV NODE_ENV=production
        COPY --from=builder /app .
        EXPOSE 3000
        CMD ["npm", "start"]
        DEOF
            else
              cat > Dockerfile <<DEOF
        FROM public.ecr.aws/docker/library/node:20-alpine
        WORKDIR /app
        COPY . .
        RUN if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; \\
            elif [ -f yarn.lock ]; then yarn install --frozen-lockfile; \\
            else npm ci --omit=dev; fi
        EXPOSE 3000
        CMD ["npm", "start"]
        DEOF
            fi

          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "Detected Python project"
            cat > Dockerfile <<'DEOF'
        FROM public.ecr.aws/docker/library/python:3.12-slim
        WORKDIR /app
        COPY requirements.txt* pyproject.toml* ./
        RUN pip install --no-cache-dir -r requirements.txt 2>/dev/null || pip install --no-cache-dir .
        COPY . .
        EXPOSE 8000
        CMD ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
        DEOF

          elif [ -f "go.mod" ]; then
            echo "Detected Go project"
            cat > Dockerfile <<'DEOF'
        FROM public.ecr.aws/docker/library/golang:1.22-alpine AS builder
        WORKDIR /app
        COPY go.* ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 go build -o /app/server .

        FROM public.ecr.aws/docker/library/alpine:3.19
        COPY --from=builder /app/server /server
        EXPOSE 8080
        CMD ["/server"]
        DEOF

          else
            echo "ERROR: Cannot detect project type and no Dockerfile found"
            exit 1
          fi
          echo "Generated Dockerfile:"
          cat Dockerfile
        fi

        echo "Building ${IMAGE_URI}:${SHORT_TAG}"
        docker buildx build \
          --progress=plain \
          --cache-from type=registry,ref=${CACHE_URI}:buildcache,ignore-error=true \
          --cache-to type=registry,ref=${CACHE_URI}:buildcache,mode=max \
          --tag ${IMAGE_URI}:${SHORT_TAG} \
          --tag ${IMAGE_URI}:latest \
          --push \
          .

  post_build:
    commands:
      - |
        source /tmp/build_env.sh
        CALLBACK_URL="${CALLBACK_URL:-}"
        BUILD_ID="${BUILD_ID:-}"

        # If build failed, notify and exit
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-1}" = "0" ]; then
          echo "Build FAILED"
          if [ -n "$CALLBACK_URL" ] && [ -n "$BUILD_ID" ]; then
            python3 << 'PYEOF'
        import json, os, urllib.request
        callback = os.environ.get('CALLBACK_URL', '')
        build_id = os.environ.get('BUILD_ID', '')
        if callback and build_id:
            data = json.dumps({'buildId': build_id, 'status': 'failed', 'statusReason': 'Docker build failed'}).encode()
            req = urllib.request.Request(callback, data=data, headers={'Content-Type': 'application/json'}, method='POST')
            try:
                urllib.request.urlopen(req, timeout=10)
                print('Failure callback sent')
            except Exception as e:
                print(f'Callback failed: {e}')
        PYEOF
          fi
          exit 0
        fi

        # Build succeeded
        printf '{"imageUri":"%s"}\n' "${IMAGE_URI}:${SHORT_TAG}" > imageDetail.json
        cat imageDetail.json

        # Notify callback of success
        if [ -n "$CALLBACK_URL" ] && [ -n "$BUILD_ID" ]; then
          python3 << 'PYEOF'
        import json, os, urllib.request
        callback = os.environ.get('CALLBACK_URL', '')
        build_id = os.environ.get('BUILD_ID', '')
        image_uri = os.environ.get('IMAGE_URI', '')
        short_tag = os.environ.get('SHORT_TAG', 'latest')
        if callback and build_id:
            data = json.dumps({'buildId': build_id, 'status': 'success', 'imageUri': f'{image_uri}:{short_tag}'}).encode()
            req = urllib.request.Request(callback, data=data, headers={'Content-Type': 'application/json'}, method='POST')
            try:
                urllib.request.urlopen(req, timeout=10)
                print('Success callback sent')
            except Exception as e:
                print(f'Callback failed: {e}')
        PYEOF
        fi

        # Notify SNS if deploy target is set (triggers CloudFormation deploy)
        if [ -n "${SNS_TOPIC_ARN:-}" ] && [ -n "${DEPLOY_TARGET:-}" ]; then
          python3 << 'PYEOF'
        import json, os, subprocess
        dp_raw = os.environ.get('DEPLOY_PARAMS', '{}')
        try:
            dp = json.loads(dp_raw)
        except:
            dp = {}
        image_uri = os.environ.get('IMAGE_URI', '')
        short_tag = os.environ.get('SHORT_TAG', 'latest')
        msg = json.dumps({
            'buildId': os.environ.get('BUILD_ID', ''),
            'imageUri': f'{image_uri}:{short_tag}',
            'deployTarget': os.environ.get('DEPLOY_TARGET', ''),
            'deployParams': dp,
            'callbackUrl': os.environ.get('CALLBACK_URL', '')
        })
        subprocess.run([
            'aws', 'sns', 'publish',
            '--topic-arn', os.environ['SNS_TOPIC_ARN'],
            '--subject', 'build-complete',
            '--message', msg
        ], check=True)
        print('SNS published for deploy')
        PYEOF
        fi

artifacts:
  files:
    - imageDetail.json

cache:
  paths:
    - '/root/.cache/**/*'
    - '/root/.npm/**/*'
    - '/root/.cache/pip/**/*'
    - '/root/.local/share/pnpm/**/*'
