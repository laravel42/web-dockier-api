AWSTemplateFormatVersion: "2010-09-09"
Description: Deploy a Docker image to a single EC2 instance with Docker Compose.

Parameters:
  AppName:
    Type: String
  ImageUri:
    Type: String
    Description: Full ECR image URI with tag
  ContainerPort:
    Type: Number
    Default: 3000
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - m6i.medium
      - m6i.large
      - m6i.xlarge
      - c6i.large
      - c6i.xlarge
    Description: EC2 instance type (amd64)
  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 8
    MaxValue: 500
    Description: Root EBS volume size in GB
  KeyPairName:
    Type: String
    Default: ""
    Description: EC2 key pair name for SSH access (optional)
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  EnvVarsJson:
    Type: String
    Default: '[]'
  BuildId:
    Type: String
    Default: ""
  CallbackUrl:
    Type: String
    Default: ""

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName} EC2"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ECRPull
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: "*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          deploy:
            - setup
            - app
        setup:
          packages:
            apt:
              docker.io: []
              jq: []
              nginx: []
              certbot: []
              python3-certbot-nginx: []
              unzip: []
          commands:
            01_enable_docker:
              command: systemctl enable docker && systemctl start docker
            02_install_awscli:
              command: |
                if ! command -v aws &>/dev/null; then
                  curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
                  unzip -q /tmp/awscliv2.zip -d /tmp
                  /tmp/aws/install
                  rm -rf /tmp/aws /tmp/awscliv2.zip
                fi
            03_install_cfn_helpers:
              command: |
                if ! command -v cfn-signal &>/dev/null; then
                  pip3 install --break-system-packages https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
                fi
        app:
          commands:
            01_ecr_login:
              command: !Sub |
                aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin $(echo "${ImageUri}" | cut -d/ -f1)
            02_deploy_container:
              command: !Sub |
                set -euo pipefail
                docker pull "${ImageUri}"
                docker stop ${AppName} 2>/dev/null || true
                docker rm ${AppName} 2>/dev/null || true

                ENV_FLAGS=""
                for row in $(echo '${EnvVarsJson}' | python3 -c "import sys,json; [print(f\"{e['name']}={e['value']}\") for e in json.load(sys.stdin)]" 2>/dev/null); do
                  ENV_FLAGS="$ENV_FLAGS -e $row"
                done

                docker run -d \
                  --name ${AppName} \
                  --restart unless-stopped \
                  -p ${ContainerPort}:${ContainerPort} \
                  -e PORT=${ContainerPort} \
                  $ENV_FLAGS \
                  "${ImageUri}"
            03_nginx_proxy:
              command: !Sub |
                cat > /etc/nginx/sites-available/${AppName} <<'NGINX'
                server {
                    listen 80 default_server;
                    server_name _;
                    location / {
                        proxy_pass http://127.0.0.1:${ContainerPort};
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                    }
                }
                NGINX
                ln -sf /etc/nginx/sites-available/${AppName} /etc/nginx/sites-enabled/default
                nginx -t && systemctl restart nginx
          files:
            /etc/systemd/system/cfn-hup.service:
              content: |
                [Unit]
                Description=cfn-hup daemon
                [Service]
                Type=simple
                ExecStart=/usr/local/bin/cfn-hup -v
                Restart=always
                [Install]
                WantedBy=multi-user.target
              mode: "000644"
              owner: root
              group: root
            /etc/cfn/cfn-hup.conf:
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}
                interval=1
              mode: "000400"
              owner: root
              group: root
            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              content: !Sub |
                [cfn-auto-reloader-hook]
                triggers=post.update
                path=Resources.Instance.Metadata.AWS::CloudFormation::Init
                action=cfn-init -v --stack ${AWS::StackName} --resource Instance --configsets deploy --region ${AWS::Region}
                runas=root
              mode: "000400"
              owner: root
              group: root
          services:
            systemd:
              cfn-hup:
                enabled: true
                ensureRunning: true
                files:
                  - /etc/cfn/cfn-hup.conf
                  - /etc/cfn/hooks.d/cfn-auto-reloader.conf
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Ref AppName
        - Key: BuildId
          Value: !Ref BuildId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/user-data.log 2>&1

          apt-get update -y
          apt-get install -y python3-pip
          pip3 install --break-system-packages https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz

          cfn-init -v --stack ${AWS::StackName} --resource Instance --configsets deploy --region ${AWS::Region}

          systemctl daemon-reload
          systemctl enable cfn-hup
          systemctl start cfn-hup

          echo "── Done ──"

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Instance
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-eip"

Outputs:
  AppUrl:
    Value: !Sub
      - "http://ec2-${IPDashed}.compute-1.amazonaws.com"
      - IPDashed: !Join ["-", !Split [".", !Ref ElasticIp]]
  PublicIp:
    Value: !Ref ElasticIp
  PublicDns:
    Value: !Sub
      - "ec2-${IPDashed}.compute-1.amazonaws.com"
      - IPDashed: !Join ["-", !Split [".", !Ref ElasticIp]]
  InstanceId:
    Value: !Ref Instance
  BuildId:
    Value: !Ref BuildId
