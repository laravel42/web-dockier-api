AWSTemplateFormatVersion: "2010-09-09"
Description: Deploy a Docker image to a single EC2 instance with Docker Compose.

Parameters:
  AppName:
    Type: String
  ImageUri:
    Type: String
    Description: Full ECR image URI with tag
  ContainerPort:
    Type: Number
    Default: 3000
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - m6i.medium
      - m6i.large
      - m6i.xlarge
      - c6i.large
      - c6i.xlarge
    Description: EC2 instance type (amd64)
  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 8
    MaxValue: 500
    Description: Root EBS volume size in GB
  KeyPairName:
    Type: String
    Default: ""
    Description: EC2 key pair name for SSH access (optional)
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  EnvVarsJson:
    Type: String
    Default: '[]'
  BuildId:
    Type: String
    Default: ""
  CallbackUrl:
    Type: String
    Default: ""

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName} EC2"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ECRPull
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: "*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Ref AppName
        - Key: BuildId
          Value: !Ref BuildId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/user-data.log 2>&1

          echo "── Installing Docker ──"
          apt-get update -y
          apt-get install -y docker.io jq nginx certbot python3-certbot-nginx unzip
          systemctl enable docker
          systemctl start docker

          echo "── Installing AWS CLI v2 ──"
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          rm -rf /tmp/aws /tmp/awscliv2.zip

          echo "── ECR Login ──"
          REGION="${AWS::Region}"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $(echo "${ImageUri}" | cut -d/ -f1)

          echo "── Pull & Run ──"
          docker pull "${ImageUri}"
          docker stop ${AppName} 2>/dev/null || true
          docker rm ${AppName} 2>/dev/null || true
          # Parse env vars from JSON parameter
          ENV_FLAGS=""
          for row in $(echo '${EnvVarsJson}' | python3 -c "import sys,json; [print(f\"{e['name']}={e['value']}\") for e in json.load(sys.stdin)]" 2>/dev/null); do
            ENV_FLAGS="$ENV_FLAGS -e $row"
          done

          docker run -d \
            --name ${AppName} \
            --restart unless-stopped \
            -p ${ContainerPort}:${ContainerPort} \
            -e PORT=${ContainerPort} \
            $ENV_FLAGS \
            "${ImageUri}"

          echo "── Nginx reverse proxy ──"
          cat > /etc/nginx/sites-available/${AppName} <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:${ContainerPort};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          NGINX
          ln -sf /etc/nginx/sites-available/${AppName} /etc/nginx/sites-enabled/default
          nginx -t && systemctl restart nginx

          echo "── Done ──"

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Instance
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-eip"

Outputs:
  AppUrl:
    Value: !Sub
      - "http://ec2-${IPDashed}.compute-1.amazonaws.com"
      - IPDashed: !Join ["-", !Split [".", !Ref ElasticIp]]
  PublicIp:
    Value: !Ref ElasticIp
  PublicDns:
    Value: !Sub
      - "ec2-${IPDashed}.compute-1.amazonaws.com"
      - IPDashed: !Join ["-", !Split [".", !Ref ElasticIp]]
  InstanceId:
    Value: !Ref Instance
  BuildId:
    Value: !Ref BuildId
